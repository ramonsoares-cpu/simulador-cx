name: simulador-cx

containerPort: 3001
cpu: 0.25
memory: 256Mi
replicaCount: 1

healthCheckPath: /api/health
periodSeconds: 30
timeoutSeconds: 5
successThreshold: 2
failureThreshold: 5

env:
  PROFILE: staging
  PORT: "3001"
  NEW_RELIC_ENABLED: "false"
  # Configuração não secreta
  TAB_EQUIPES: "E-mail - Equipe"
  TAB_HISTORICO: "Histórico 2026"
  TAB_FERIADOS: "Feriados"
  TAB_TYMERSHIFT: "2026-07"
  BOTS_IGNORADOS: "caio.hotmart@hotmart.com,claudia.cloudhumans@external.hotmart.com"
  # Secrets
  GOOGLE_CLIENT_EMAIL:
    secretKeyRef:
      name: simulador-cx-google-client-email
      key: GOOGLE_CLIENT_EMAIL
  GOOGLE_PRIVATE_KEY:
    secretKeyRef:
      name: simulador-cx-google-private-key
      key: GOOGLE_PRIVATE_KEY
  SHEET_STATUS_ID:
    secretKeyRef:
      name: simulador-cx-sheet-status-id
      key: SHEET_STATUS_ID
  SHEET_HISTORICO_ID:
    secretKeyRef:
      name: simulador-cx-sheet-historico-id
      key: SHEET_HISTORICO_ID
  SHEET_TYMERSHIFT_ID:
    secretKeyRef:
      name: simulador-cx-sheet-tymershift-id
      key: SHEET_TYMERSHIFT_ID

lb:
  type: internal
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://auth.hotmart.run/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.hotmart.run/login?rd=https://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email,X-Auth-Request-User"
  hosts:
  - host: simulador-cx.hotmart.run
    paths: ["/"]

imports:
- to: module.base-module.aws_ecr_repository.application-default-ecr[0]
  id: "simulador-cx"
